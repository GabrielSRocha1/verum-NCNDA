<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VERUM NCNDA — Mesa privada (pré-visualização navegável)</title>
<meta name="theme-color" content="#0A0E1A">
<link rel="icon" href="data:image/svg+xml;utf8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 512 512&quot;&gt;&lt;rect width=&quot;512&quot; height=&quot;512&quot; rx=&quot;112&quot; fill=&quot;#0A0E1A&quot;/&gt;&lt;rect x=&quot;64&quot; y=&quot;64&quot; width=&quot;384&quot; height=&quot;384&quot; rx=&quot;88&quot; fill=&quot;#1F45C6&quot;/&gt;&lt;path d=&quot;M150 168h62l44 132 44-132h62l-78 196h-56z&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;
">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@400;600;700;800&display=swap">
<style>
/* VERUM NCNDA PRIVATE DAPP — design system
   Obsidian como fundo, Azul Verum para cards/ações, branco alternado.
   Verde só para ação/confirmação. Vermelho só para erro/bloqueio. Dourado reservado a valor em escrow real (não usado no DEMO). */
:root {
  --obsidian: #0A0E1A;
  --surface: #11172A;
  --surface-2: #182038;
  --line: #263052;
  --text: #E9EDF7;
  --muted: #9AA5C3;
  --verum-blue: #1F45C6;
  --verum-blue-deep: #16339A;
  --white: #FFFFFF;
  --green: #2FC07E;
  --green-ink: #062316;
  --red: #FF6B6B;
  --red-bg: #3A1418;
  --gold: #D9A94B;
  --amber-ink: #F5C16C;
  --font-head: 'Sora', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r-card: 18px;
  --r-ctl: 12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--obsidian); color: var(--text);
  font: 15px/1.5 var(--font-body); min-height: 100vh;
  background-image: radial-gradient(1200px 500px at 85% -10%, rgba(31,69,198,.18), transparent 60%);
  background-attachment: fixed;
}
h1, h2, h3 { font-family: var(--font-head); margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 24px; line-height: 1.2; }
h2 { font-size: 18px; line-height: 1.3; }
h3 { font-size: 15px; }
p { margin: 0; }
a { color: inherit; }
.mono { font-family: var(--font-mono); font-feature-settings: 'zero' 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid #7FA2FF; outline-offset: 2px; border-radius: 6px; }

/* ---------------------------------------------------------------- shell */
.demo-ribbon {
  position: sticky; top: 0; z-index: 30; text-align: center; font: 600 11px/1 var(--font-mono);
  letter-spacing: .08em; padding: 7px 8px; background: #2A2207; color: var(--amber-ink); border-bottom: 1px solid #4A3B10;
}
.shell { display: flex; min-height: calc(100vh - 25px); }
.sidebar { display: none; }
.main { flex: 1; min-width: 0; padding: 18px 16px calc(96px + var(--safe-b)); max-width: 760px; margin: 0 auto; width: 100%; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--font-head); letter-spacing: .02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--verum-blue); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand small { display: block; font: 500 11px/1.2 var(--font-body); color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.who { font-size: 12px; color: var(--muted); text-align: right; }
.who b { color: var(--text); font-weight: 600; display: block; font-size: 13px; }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(10,14,26,.96); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); backdrop-filter: blur(10px);
}
.bottomnav a, .sidebar a {
  text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; min-height: 58px; font-size: 11px; font-weight: 500;
}
.bottomnav a[aria-current="page"], .sidebar a[aria-current="page"] { color: var(--white); }
.bottomnav a[aria-current="page"] svg { color: #8FB0FF; }
.bottomnav svg, .sidebar svg { width: 21px; height: 21px; }

@media (min-width: 1024px) {
  .sidebar {
    display: flex; flex-direction: column; gap: 2px; width: 240px; padding: 22px 14px; border-right: 1px solid var(--line);
    position: sticky; top: 25px; height: calc(100vh - 25px); background: rgba(17,23,42,.6);
  }
  .sidebar .brand { margin: 0 8px 22px; }
  .sidebar a { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; min-height: 44px; font-size: 14px; border-radius: 10px; }
  .sidebar a[aria-current="page"] { background: var(--surface-2); }
  .bottomnav { display: none; }
  .main { padding: 28px 32px 48px; max-width: 980px; }
  .topbar .brand { display: none; }
}

/* ---------------------------------------------------------------- controles */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: var(--r-ctl); border: 1px solid transparent; font: 600 14px/1.1 var(--font-body); cursor: pointer;
  text-decoration: none; letter-spacing: .01em; touch-action: manipulation;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn-primary { background: var(--green); color: var(--green-ink); }
.btn-blue { background: var(--verum-blue); color: var(--white); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn-danger { background: transparent; color: var(--red); border-color: #6A2A2F; }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row > .btn { flex: 1 1 auto; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.icon-btn svg { width: 22px; height: 22px; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 12px 14px; border-radius: var(--r-ctl); border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: 15px/1.3 var(--font-body);
}
textarea { min-height: 110px; resize: vertical; }
input.code-input { font: 600 22px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.form-error { color: var(--red); font-size: 13px; margin-top: 8px; }

/* ---------------------------------------------------------------- chips / pills */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font: 600 11px/1.2 var(--font-mono);
  letter-spacing: .04em; border: 1px solid var(--line); color: var(--text); white-space: nowrap;
}
.chip-seal { background: var(--white); color: var(--verum-blue-deep); border-color: var(--white); }
.chip-onchain { color: #9FE3C2; border-color: #1E5A41; }
.chip-off { color: #FFB4B4; border-color: #6A2A2F; white-space: normal; text-align: left; }
.chip-status { color: var(--muted); }
.chip-ok { color: var(--green); border-color: #1E5A41; }
.chip-demo { color: var(--amber-ink); border-color: #4A3B10; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.notice { border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; border: 1px solid var(--line); background: var(--surface); }
.notice-risk { border-color: #6A2A2F; background: var(--red-bg); color: #FFD3D3; }
.notice-info { border-color: #24407F; background: #0F1A38; color: #CFDBFF; }

/* ---------------------------------------------------------------- Card de Qualificação (banner) */
.stack { display: flex; flex-direction: column; gap: 16px; }
.qual {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; text-align: left;
  color: inherit; width: 100%; padding: 0; cursor: pointer; font: inherit;
}
.qual:hover { border-color: #3A4A80; }
/* Card com faixa de atalhos: os dois elementos são irmãos (link não pode viver dentro de botão),
   mas a borda compartilhada os faz ler como um cartão só. */
.qual-wrap { display: flex; flex-direction: column; }
.qual-attached { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
.qual-actions {
  display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 16px;
  background: var(--surface-2); border: 1px solid var(--line); border-top: 1px solid var(--line);
  border-radius: 0 0 var(--r-card) var(--r-card);
}
.qual-wrap:hover .qual-attached, .qual-wrap:hover .qual-actions { border-color: #3A4A80; }
.qual-head { padding: 16px 16px 14px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); border-bottom: 1px solid var(--line); }
.qual-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.qual-business { font: 600 12px/1.2 var(--font-body); color: #9FB6FF; margin-bottom: 2px; }
.qual-title { font: 600 16px/1.3 var(--font-head); }
.direction { font: 700 34px/1.05 var(--font-head); letter-spacing: -0.02em; margin: 12px 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.direction .arrow { color: #7FA2FF; font-weight: 400; }
.qual-body { padding: 14px 16px 16px; display: grid; gap: 14px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fact span { display: block; font-size: 12px; color: var(--muted); }
.fact b { font-weight: 600; font-size: 14px; }
.grade { display: flex; align-items: baseline; gap: 10px; }
.grade .mono { font-size: 26px; font-weight: 700; color: var(--white); }
.comm { width: 100%; border-collapse: collapse; font-size: 13px; }
.comm td { padding: 7px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.comm td:last-child { text-align: right; font-family: var(--font-mono); white-space: nowrap; padding-left: 10px; }
.comm tr.residual td { color: #FFD48A; }
.comm tr.total td { border-bottom: 0; font-weight: 700; padding-top: 9px; }
.conditions { margin: 0; padding-left: 18px; font-size: 13px; color: #C9D2EA; }
.conditions li { margin: 3px 0; }
.qual-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.kn { font: 700 12px/1 var(--font-mono); color: var(--text); }

/* ---------------------------------------------------------------- Tela de Parceiros */
.op-summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); margin-bottom: 18px; }
.op-summary .direction { font-size: 24px; margin: 0; }
.partners { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 18px; }
.partners::before { content: ''; position: absolute; left: 6px; top: 22px; bottom: 22px; width: 2px; background: linear-gradient(var(--verum-blue), #3A4A80); border-radius: 2px; }
.pcard {
  position: relative; border-radius: var(--r-card); padding: 16px 16px 14px; border: 2px solid transparent; text-align: left;
  font: inherit; width: 100%; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
}
.pcard::before { content: ''; position: absolute; left: -17px; top: 24px; width: 10px; height: 10px; border-radius: 50%; background: var(--obsidian); border: 2px solid #7FA2FF; }
.pcard.blue { background: var(--verum-blue); color: var(--white); }
.pcard.white { background: var(--white); color: var(--verum-blue); }
.pcard.blue .pmeta { color: #DCE5FF; }
.pcard.white .pmeta { color: var(--verum-blue-deep); }
.pcard.pm { border-width: 4px; padding: 20px 18px 18px; min-height: 196px; }
.pcard.blue.pm { border-color: #BFD0FF; }
.pcard.white.pm { border-color: var(--verum-blue); }
.pcard.pm::before { width: 14px; height: 14px; left: -19px; background: #7FA2FF; }
.pm-badge {
  grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px;
  border-radius: 999px; font: 800 15px/1 var(--font-head); letter-spacing: .06em; white-space: nowrap; flex-shrink: 0;
  margin-bottom: 8px; max-width: none;
}
.pcard.blue .pm-badge { background: var(--white); color: var(--verum-blue-deep); }
.pcard.white .pm-badge { background: var(--verum-blue); color: var(--white); }
.pm-badge svg { width: 18px; height: 18px; flex-shrink: 0; }
.pname { font: 700 18px/1.25 var(--font-head); overflow-wrap: anywhere; }
.prole { font-weight: 600; font-size: 13px; }
.pmeta { font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
.pright { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; grid-row: span 3; }
.pct { font: 700 22px/1 var(--font-mono); }
.pstatus { grid-column: 1 / -1; font-size: 13px; font-weight: 600; margin-top: 6px; }
.pcard.empty { background: transparent; color: var(--muted); border: 2px dashed var(--line); cursor: default; }
.pcard.empty.pm, .pcard.empty { min-height: 0; }

/* ---------------------------------------------------------------- Bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(4,6,12,.62); z-index: 50; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--surface); border-top-left-radius: 22px; border-top-right-radius: 22px;
  border: 1px solid var(--line); height: 52vh; max-height: calc(100vh - 40px); overflow-y: auto; padding: 8px 18px calc(22px + var(--safe-b));
  transition: height .18s ease, transform .18s ease; transform: translateY(0); max-width: 640px; margin: 0 auto;
}
.sheet.expanded { height: 92vh; }
.sheet.entering { transform: translateY(100%); }
.sheet-handle { display: block; width: 100%; height: 28px; background: none; border: 0; cursor: pointer; }
.sheet-handle::after { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: #3A4670; margin: 8px auto; }
.sheet h2 { margin-bottom: 4px; }
.qrbox { background: var(--white); border-radius: 16px; padding: 14px; width: min(260px, 70vw); margin: 14px auto; }
.qrbox svg { display: block; width: 100%; height: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 12px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.paylabel { margin: 12px 0; padding: 10px 12px; border-radius: 10px; font: 700 12px/1.35 var(--font-mono); letter-spacing: .02em; border: 1px dashed #4A5A90; color: #CFDBFF; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

/* ---------------------------------------------------------------- Deal Room */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 16px; padding: 0 16px 4px; scrollbar-width: none; }
.tabs a { flex: 0 0 auto; text-decoration: none; padding: 0 14px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; }
.tabs a[aria-current="page"] { background: var(--white); color: var(--verum-blue-deep); border-color: var(--white); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.list { display: flex; flex-direction: column; }
.list > div { padding: 12px 0; border-bottom: 1px solid var(--line); }
.list > div:last-child { border-bottom: 0; }
.hash { font: 12px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.chain { display: flex; flex-direction: column; align-items: stretch; }
.chain-node { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface-2); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.chain-node.pm { border: 2px solid #7FA2FF; }
.chain-link { width: 2px; height: 18px; background: #3A4A80; margin: 0 auto; }
.counters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
.counter { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.counter b { display: block; font: 700 24px/1.1 var(--font-head); }
.counter span { font-size: 12px; color: var(--muted); }
@media (min-width: 720px) { .counters { grid-template-columns: repeat(4, 1fr); } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 12px; }
.empty-state { text-align: center; padding: 28px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-card); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + var(--safe-b)); z-index: 80; background: var(--white); color: var(--obsidian); padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.toast.err { background: var(--red-bg); color: #FFD3D3; border: 1px solid #6A2A2F; }
.editor-line { display: grid; grid-template-columns: 1fr 96px; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.editor-line .sub { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.sumbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 12px; margin: 12px 0; font: 600 13px/1.3 var(--font-mono); }
.sumbar.ok { background: #0C2A1C; color: var(--green); }
.sumbar.bad { background: var(--red-bg); color: var(--red); }
.sigmsg { white-space: pre-wrap; font: 12px/1.5 var(--font-mono); background: var(--obsidian); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 40vh; overflow: auto; }

/* ---------------------------------------------------------------- telas de entrada / convite */
.gate { min-height: calc(100vh - 25px); display: flex; flex-direction: column; justify-content: center; padding: 28px 20px calc(28px + var(--safe-b)); max-width: 480px; margin: 0 auto; }
.gate .brand { margin-bottom: 36px; }
.gate h1 { font-size: 30px; margin-bottom: 10px; }
.gate .lead { color: var(--muted); margin-bottom: 26px; }
.choice { display: grid; gap: 12px; }
.choice .btn { min-height: 64px; font-size: 15px; justify-content: flex-start; padding: 0 18px; text-align: left; }
.choice .hint { font-size: 13px; color: var(--muted); margin-top: -4px; }
.steps { display: flex; gap: 6px; margin-bottom: 20px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: #7FA2FF; }
.wallet-acc { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.wallet-acc + .wallet-acc { margin-top: 8px; }

.demo-ribbon{display:flex;justify-content:center;align-items:center;gap:8px}.ribbon-reset{background:none;border:1px solid #4A3B10;color:#F5C16C;font:inherit;padding:3px 8px;border-radius:999px;cursor:pointer;min-height:0}

html, body { background: #0A0E1A; }
</style>
</head>
<body>
<div id="app"><noscript>Ative o JavaScript para usar a mesa privada.</noscript></div>

<script type="module">
// ===== onboarding-logic.js =====
// Regras de apresentação da TELA 1 do convite (testadas em node).
function choiceState({ walletAvailable, downloadUrl }) {
  return {
    primary: walletAvailable ? 'signup' : 'download',
    signupDisabled: !walletAvailable,
    signupReason: walletAvailable ? null : 'Verum Wallet não encontrada neste aparelho.',
    showDownload: !!downloadUrl,
    downloadUrl: downloadUrl || null,
    downloadFallback: downloadUrl ? null : 'Peça o link de download ao responsável pela mesa.',
    afterInstall: 'Depois de instalar, peça um novo link ao responsável pela mesa.',
  };
}

/** Converte "3,33" em bps sem float. Retorna null se inválido. */
function pctToBps(input) {
  const s = String(input ?? '').trim().replace('%', '').replace(',', '.');
  const m = s.match(/^(\d{1,3})(?:\.(\d{1,2}))?$/);
  if (!m) return null;
  const v = Number(m[1]) * 100 + Number((m[2] ?? '').padEnd(2, '0') || '0');
  return v <= 10000 ? v : null;
}
function bpsToPct(bps) {
  return `${Math.floor(bps / 100)},${String(bps % 100).padStart(2, '0')}`;
}

// ===== wallet-adapter.js =====
// WalletAdapter (cliente). Aceita SOMENTE o provider da Verum Wallet.
// Não existe, até aqui, API pública da Verum Wallet para web: em DEMO usamos uma carteira simulada
// marcada "DEMO", que assina mensagens Ed25519 de verdade (verificadas pelo backend).
// Nenhuma seed, chave privada ou senha é pedida ao usuário em nenhum momento.

/**
 * Formas usadas só para conferência de tipos (JSDoc; nada disso existe em runtime).
 * @typedef {{ id: string, isVerumWallet?: boolean, [k: string]: any }} Provider
 * @typedef {{ key: string, name: string, hint?: string }} Persona
 */

const VERUM_PROVIDER_ID = 'verum-wallet';

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function base58Encode(bytes) {
  let n = 0n;
  for (const b of bytes) n = (n << 8n) | BigInt(b);
  let out = '';
  while (n > 0n) { out = B58[Number(n % 58n)] + out; n /= 58n; }
  for (const b of bytes) { if (b === 0) out = '1' + out; else break; }
  return out;
}

const nacl = () => {
  const n = globalThis.nacl;
  if (!n) throw new Error('Biblioteca de assinatura indisponível');
  return n;
};

/** Escolhe o provider: só a Verum Wallet. Qualquer outro (Phantom, Solflare, injetados) é recusado. */
function selectProvider(providers) {
  const list = Array.isArray(providers) ? providers : [];
  const p = list.find((x) => x && x.id === VERUM_PROVIDER_ID && x.isVerumWallet === true);
  if (!p) {
    const err = new Error('Somente a Verum Wallet pode conectar nesta mesa.');
    err.code = 'PROVIDER_REFUSED';
    throw err;
  }
  return p;
}

/** Chave DEMO derivada de semente pública — idêntica à do servidor (src/demo.ts). */
function demoPersonaKeyPair(key) {
  const n = nacl();
  const seed = n.hash(new TextEncoder().encode(`verum-ncnda-demo-persona:${key}`)).slice(0, 32);
  return n.sign.keyPair.fromSeed(seed);
}

/** Provider simulado da Verum Wallet (somente DEMO). */
class DemoVerumWalletProvider {
  constructor({ personas = [], storage = null } = {}) {
    this.id = VERUM_PROVIDER_ID;
    this.isVerumWallet = true;
    this.demo = true;
    this.label = 'Verum Wallet (DEMO)';
    this.personas = personas;
    this.storage = storage;
    this.current = null;
  }
  guestSeeds() {
    try { return JSON.parse(this.storage?.getItem('votc-demo-guests') ?? '[]'); } catch { return []; }
  }
  accounts() {
    const guests = this.guestSeeds().map((g) => {
      const kp = nacl().sign.keyPair.fromSeed(Uint8Array.from(g.seed));
      return { key: `guest:${g.id}`, name: g.label, hint: 'Carteira criada neste aparelho (DEMO)', address: base58Encode(kp.publicKey), kind: 'guest' };
    });
    const personas = this.personas.map((p) => ({ ...p, kind: 'persona', address: base58Encode(demoPersonaKeyPair(p.key).publicKey) }));
    return [...guests, ...personas];
  }
  createGuest() {
    const seed = Array.from(nacl().randomBytes(32));
    const list = this.guestSeeds();
    const id = list.length + 1;
    list.push({ id, label: `Nova carteira ${String(id).padStart(2, '0')}`, seed });
    this.storage?.setItem('votc-demo-guests', JSON.stringify(list));
    return this.accounts().find((a) => a.key === `guest:${id}`);
  }
  keyPairFor(key) {
    if (key.startsWith('guest:')) {
      const g = this.guestSeeds().find((x) => `guest:${x.id}` === key);
      if (!g) throw new Error('Conta não encontrada');
      return nacl().sign.keyPair.fromSeed(Uint8Array.from(g.seed));
    }
    return demoPersonaKeyPair(key);
  }
  connect(key) {
    const kp = this.keyPairFor(key);
    this.current = { key, address: base58Encode(kp.publicKey) };
    return this.current;
  }
  /** Assina MENSAGEM (identidade/aceite/autorização). Nunca transação. */
  signMessage(message) {
    if (!this.current) throw new Error('Carteira não conectada');
    const kp = this.keyPairFor(this.current.key);
    return base58Encode(nacl().sign.detached(new TextEncoder().encode(message), kp.secretKey));
  }
}

/**
 * WalletAdapter: isAvailable() decide a TELA 1 do convite.
 * - DEMO: o provider simulado está disponível, a menos que o teste "simular sem Verum Wallet" esteja ligado.
 * - Fora do DEMO: indisponível até existir integração real publicada pela Verum Wallet (não inventamos API).
 *
 * @param {{ demoMode?: boolean, simulateMissing?: boolean, personas?: Persona[], storage?: Storage | null, injected?: Provider[] }} opts
 */
function createWalletAdapter({ demoMode, simulateMissing = false, personas = [], storage = null, injected = [] }) {
  const providers = [...injected];
  if (demoMode) providers.push(new DemoVerumWalletProvider({ personas, storage }));
  let provider = null;
  try { provider = selectProvider(providers); } catch { provider = null; }
  return {
    provider,
    isAvailable: () => !!provider && !simulateMissing,
    attestation: null, // não existe mecanismo de atestação: nunca afirmar "autocustódia verificada"
  };
}

/** QR gerado localmente (biblioteca embarcada), desenhado como SVG via DOM. */
function qrSvg(text) {
  const qr = globalThis.qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  const m = 2;
  s.setAttribute('viewBox', `0 0 ${n + m * 2} ${n + m * 2}`); s.setAttribute('shape-rendering', 'crispEdges');
  s.setAttribute('role', 'img'); s.setAttribute('aria-label', 'QR Code do endereço');
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  const bg = document.createElementNS(ns, 'rect'); bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', '#fff');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); p.setAttribute('fill', '#0A0E1A');
  s.append(bg, p);
  return s;
}

// ---------------------------------------------------------------- API
async function api(method, url, body) {
  const r = await fetch(url, {
    method, credentials: 'same-origin',
    headers: body !== undefined ? { 'content-type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await r.json(); } catch { data = {}; }
  if (!r.ok) {
    const e = new Error(data.message || 'Falha na comunicação com a mesa.');
    e.status = r.status; e.code = data.error; e.data = data;
    throw e;
  }
  return data;
}

let toastTimer = null;
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  clear(el);
  el.append(h('div', { class: `toast ${kind === 'err' ? 'err' : ''}` }, msg));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => clear(el), 4200);
}
async function copy(text, label = 'Copiado') {
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch {
    const ta = h('textarea', { 'aria-hidden': 'true', style: 'position:fixed;opacity:0' }); ta.value = text;
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast(label); } catch { toast('Não foi possível copiar. Selecione e copie manualmente.', 'err'); }
    ta.remove();
  }
}

// ---------------------------------------------------------------- Bottom sheet
let sheetReturnFocus = null;
function openSheet(build, { label = 'Detalhes', onClose } = {}) {
  const overlay = document.getElementById('overlay');
  clear(overlay);
  sheetReturnFocus = document.activeElement;
  const close = () => { clear(overlay); document.removeEventListener('keydown', onKey); onClose?.(); sheetReturnFocus?.focus?.(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const sheet = h('div', { class: 'sheet entering', role: 'dialog', 'aria-modal': 'true', 'aria-label': label });
  const handle = h('button', { class: 'sheet-handle', 'aria-label': 'Expandir ou recolher', onclick: () => sheet.classList.toggle('expanded') });
  sheet.append(handle);
  const body = h('div', {});
  sheet.append(body);
  overlay.append(h('div', { class: 'scrim', onclick: close }), sheet);
  requestAnimationFrame(() => sheet.classList.remove('entering'));
  const api = { close, body, sheet, render: (...kids) => { clear(body); append(body, kids); } };
  build(api);
  // Foco no primeiro controle sem rolar: o QR (topo do sheet) precisa ficar visível.
  setTimeout(() => { (sheet.querySelector('button:not(.sheet-handle), input, a') || handle).focus({ preventScroll: true }); sheet.scrollTop = 0; }, 30);
  return api;
}

// ---------------------------------------------------------------- Verum Wallet (DEMO)
function getAdapter() {
  if (!state.adapter) {
    state.adapter = createWalletAdapter({
      demoMode: !!state.config?.demoMode,
      simulateMissing: sessionStorage.getItem('votc-sim-no-wallet') === '1',
      personas: state.personas,
      storage: localStorage,
    });
  }
  return state.adapter;
}
function resetAdapter() { state.adapter = null; }

/** Seletor de conta da carteira simulada. */
function walletPick({ title = 'Conectar Verum Wallet', allowCreate = true, only = null } = {}) {
  const ad = getAdapter();
  return new Promise((resolve, reject) => {
    if (!ad.isAvailable()) { reject(Object.assign(new Error('Verum Wallet não encontrada neste aparelho.'), { code: 'NO_WALLET' })); return; }
    let done = false;
    openSheet((s) => {
      const draw = () => {
        const accs = ad.provider.accounts().filter((a) => !only || only.includes(a.key));
        s.render(
          h('h2', {}, title),
          h('p', { class: 'muted small' }, 'Verum Wallet (DEMO). As chaves ficam na carteira; a mesa nunca pede seed, chave privada ou senha.'),
          h('div', { style: 'margin:14px 0' },
            accs.map((a) => h('button', { class: 'wallet-acc', onclick: () => { done = true; s.close(); resolve(a); } },
              h('div', {}, h('b', {}, a.name), h('div', { class: 'small muted' }, a.hint || '')),
              h('span', { class: 'mono small' }, `${a.address.slice(0, 4)}...${a.address.slice(-4)}`)))),
          allowCreate ? h('button', { class: 'btn btn-ghost btn-block', onclick: () => { ad.provider.createGuest(); draw(); } }, icon('plus'), 'Criar nova carteira (DEMO)') : null,
          h('p', { class: 'small muted', style: 'margin-top:12px' }, 'Personas DEMO usam chaves derivadas de sementes públicas. NO REAL FUNDS.'),
        );
      };
      draw();
    }, { label: title, onClose: () => { if (!done) reject(Object.assign(new Error('Conexão cancelada.'), { code: 'CANCELLED' })); } });
  });
}

/** Pedido de assinatura de MENSAGEM, exibido como a carteira exibiria. */
function walletSign(message, { title = 'Assinar mensagem', action = 'ASSINAR' } = {}) {
  const ad = getAdapter();
  return new Promise((resolve, reject) => {
    let done = false;
    openSheet((s) => {
      s.render(
        h('h2', {}, title),
        h('p', { class: 'muted small', style: 'margin-bottom:10px' }, `Verum Wallet (DEMO) · ${ad.provider.current ? ad.provider.current.address.slice(0, 4) + '...' + ad.provider.current.address.slice(-4) : ''}`),
        h('div', { class: 'sigmsg' }, message),
        h('div', { class: 'btn-row', style: 'margin-top:14px' },
          h('button', { class: 'btn btn-ghost', onclick: () => s.close() }, 'RECUSAR'),
          h('button', { class: 'btn btn-primary', onclick: () => { done = true; const sig = ad.provider.signMessage(message); s.close(); resolve(sig); } }, action)),
      );
    }, { label: title, onClose: () => { if (!done) reject(Object.assign(new Error('Assinatura recusada.'), { code: 'CANCELLED' })); } });
  });
}

/** Login sem senha: challenge → assinatura → sessão curta. */
async function walletLogin(accountKey = null) {
  const ad = getAdapter();
  const acc = accountKey ? ad.provider.accounts().find((a) => a.key === accountKey) : await walletPick({ title: 'Entrar com a Verum Wallet' });
  ad.provider.connect(acc.key);
  const ch = await api('POST', '/auth/wallet-challenge', { address: acc.address });
  const signature = await walletSign(ch.message, { title: 'Entrar na mesa', action: 'ASSINAR E ENTRAR' });
  await api('POST', '/auth/wallet-verify', { challengeId: ch.challengeId, nonce: ch.nonce, signature });
  state.me = await api('GET', '/api/me');
  return state.me;
}

/**
 * Entrar por um link de visualização. Aqui o LINK é a autorização, não o convite: carteira sem
 * cadastro é aceita e o cadastro nasce na identificação seguinte (passo SIGNUP).
 */
async function walletViewLink(token) {
  const ad = getAdapter();
  const acc = await walletPick({ title: 'Abrir link de visualização' });
  ad.provider.connect(acc.key);
  const ch = await api('POST', `/api/shared/${token}/wallet-challenge`, { address: acc.address });
  const signature = await walletSign(ch.message, { title: 'Prova de posse da carteira', action: 'ASSINAR E ABRIR' });
  return api('POST', `/api/shared/${token}/wallet-verify`, { challengeId: ch.challengeId, nonce: ch.nonce, signature });
}

/** Garante que a carteira simulada está conectada na conta da sessão (para assinar aceites). */
function ensureWalletForMe() {
  const ad = getAdapter();
  if (!ad.provider) throw new Error('Verum Wallet indisponível.');
  const acc = ad.provider.accounts().find((a) => a.address === state.me?.wallet);
  if (!acc) throw new Error('A carteira desta sessão não está neste aparelho. Entre novamente pela Verum Wallet.');
  ad.provider.connect(acc.key);
  return acc;
}

/** Fluxo genérico: pede challenge, assina na carteira, envia assinatura. */
async function signFlow(challengeUrl, submitUrl, opts) {
  ensureWalletForMe();
  const ch = await api('POST', challengeUrl);
  const signature = await walletSign(ch.message, opts);
  return api('POST', submitUrl, { challengeId: ch.challengeId, nonce: ch.nonce, signature });
}

// ===== invite.js =====
// Fluxo do parceiro a partir do link /i/:token. O GET da página nunca consome o convite.


const GENERIC = 'Este convite não é mais válido. Peça um novo link.';

function startInvite(root, token) {
  const st = { step: 'ENTRY', summary: null, wallet: null, error: null, busy: false, existing: false };

  const steps = ['CHOICE', 'CODE', 'WALLET', 'SIGNUP', 'TERMS'];
  const progress = () => h('div', { class: 'steps', 'aria-hidden': 'true' }, steps.map((s, i) => h('i', { class: steps.indexOf(st.step) >= i ? 'on' : '' })));
  const fail = (e) => {
    // Mostra o motivo que o servidor deu, em vez de um texto fixo: no servidor real ele é
    // sempre o GENERIC (de propósito, para não revelar se um token existe), mas a
    // pré-visualização sabe distinguir "aberto em outro navegador" de "já usado".
    if (e.code === 'INVITE_INVALID' || e.status === 404) { st.step = 'INVALID'; st.invalidReason = e.message || GENERIC; draw(); return; }
    st.error = e.message; draw();
  };
  const summaryBox = () => st.summary ? h('div', { class: 'panel', style: 'margin-bottom:16px' },
    h('div', { class: 'row' }, h('span', { class: 'chip chip-seal' }, st.summary.kind === 'UNICA' ? 'OFERTA ÚNICA' : 'PARCERIA PERMANENTE'), h('span', { class: 'mono small' }, st.summary.dealCode)),
    h('div', { class: 'direction', style: 'font-size:26px' }, `${st.summary.direction.deliver.split(':')[0]} → ${st.summary.direction.receive.split(':')[0]}`),
    h('dl', { class: 'kv' },
      h('dt', {}, 'Operação'), h('dd', {}, st.summary.title),
      h('dt', {}, 'Sua função'), h('dd', {}, st.summary.role),
      h('dt', {}, 'Seu percentual'), h('dd', { class: 'mono' }, st.summary.bpsLabel)),
    h('p', { class: 'small muted' }, 'Função e percentual foram definidos pelo responsável da mesa e não podem ser alterados aqui.')) : null;

  function draw() {
    clear(root);
    const wrap = h('main', { class: 'gate' }, brand('Convite privado'));
    const err = st.error ? h('p', { class: 'form-error', role: 'alert' }, st.error) : null;
    st.error = null;

    if (st.step === 'ENTRY') {
      add(wrap, 
        h('h1', {}, 'Convite privado VERUM NCNDA'),
        h('p', { class: 'lead' }, 'Toque para abrir. Atenção: o convite só abre uma vez, neste aparelho.'),
        h('button', { class: 'btn btn-primary btn-block', disabled: st.busy, onclick: open }, 'ABRIR CONVITE'), err);
    } else if (st.step === 'INVALID') {
      add(wrap, h('h1', {}, 'Convite indisponível'), h('p', { class: 'lead' }, st.invalidReason || GENERIC));
    } else if (st.step === 'CHOICE') {
      const ad = getAdapter();
      const cs = choiceState({ walletAvailable: ad.isAvailable(), downloadUrl: state.config?.walletDownloadUrl });
      add(wrap, progress(),
        h('h1', {}, 'Como você quer seguir?'),
        h('p', { class: 'lead' }, 'Para entrar na mesa você precisa da Verum Wallet, a carteira de autocustódia em que as chaves ficam só com você.'),
        h('div', { class: 'choice' },
          h('button', { class: `btn ${cs.primary === 'signup' ? 'btn-primary' : 'btn-ghost'}`, disabled: cs.signupDisabled, onclick: () => { st.step = 'CODE'; draw(); } }, 'CRIAR CADASTRO (tenho a Verum Wallet)'),
          cs.signupDisabled ? h('p', { class: 'hint' }, cs.signupReason) : null,
          cs.showDownload
            ? h('a', { class: `btn ${cs.primary === 'download' ? 'btn-primary' : 'btn-ghost'}`, href: cs.downloadUrl, target: '_blank', rel: 'noopener noreferrer', onclick: () => { st.afterDownload = true; setTimeout(draw, 50); } }, 'NÃO TENHO A VERUM WALLET — BAIXAR')
            : h('div', { class: `notice ${cs.primary === 'download' ? 'notice-info' : ''}` }, 'Não tem a Verum Wallet? ', cs.downloadFallback),
          (st.afterDownload || cs.primary === 'download') ? h('p', { class: 'notice notice-risk' }, cs.afterInstall + ' Este link já foi aberto e não serve para um novo acesso.') : null),
        state.config?.demoMode ? h('button', {
          class: 'btn btn-ghost btn-sm', style: 'margin-top:18px', onclick: () => {
            const on = sessionStorage.getItem('votc-sim-no-wallet') === '1';
            sessionStorage.setItem('votc-sim-no-wallet', on ? '0' : '1'); resetAdapter(); draw();
          },
        }, sessionStorage.getItem('votc-sim-no-wallet') === '1' ? 'DEMO: voltar a ter a Verum Wallet' : 'DEMO: simular aparelho sem Verum Wallet') : null, err);
    } else if (st.step === 'CODE') {
      const input = h('input', { class: 'code-input', inputmode: 'text', autocomplete: 'one-time-code', placeholder: 'VOTC-XXXXXX', maxlength: '11', 'aria-label': 'Código do convite' });
      add(wrap, progress(), h('h1', {}, 'Código do convite'),
        h('p', { class: 'lead' }, 'Digite o código que veio junto com o link.'),
        h('form', { onsubmit: (e) => { e.preventDefault(); verify(input.value); } },
          input, err, h('button', { class: 'btn btn-primary btn-block', style: 'margin-top:14px', disabled: st.busy }, 'CONFIRMAR CÓDIGO')));
      setTimeout(() => input.focus(), 30);
    } else if (st.step === 'WALLET') {
      add(wrap, progress(), h('h1', {}, 'Conecte a Verum Wallet'), summaryBox(),
        h('p', { class: 'lead' }, 'Você vai assinar uma mensagem que prova que a carteira é sua. Não é transação e não movimenta fundos. Nunca pedimos seed, chave privada ou senha.'),
        h('button', { class: 'btn btn-primary btn-block', disabled: st.busy, onclick: connect }, 'CONECTAR VERUM WALLET'), err);
    } else if (st.step === 'SIGNUP') {
      const f = {
        fullName: h('input', { autocomplete: 'name', required: true, maxlength: '120' }),
        email: h('input', { type: 'email', autocomplete: 'email', required: true, maxlength: '254' }),
        phone: h('input', { type: 'tel', autocomplete: 'tel', required: true, placeholder: '+55 11 91234-5678', maxlength: '24' }),
        country: h('select', {}, [['BR', 'Brasil'], ['PY', 'Paraguai'], ['AR', 'Argentina'], ['UY', 'Uruguai'], ['US', 'Estados Unidos'], ['PT', 'Portugal'], ['AE', 'Emirados Árabes'], ['CH', 'Suíça']].map(([v, l]) => h('option', { value: v }, l))),
      };
      add(wrap, progress(), h('h1', {}, 'Cadastro'),
        h('p', { class: 'lead' }, `Carteira ${st.wallet ? st.wallet.slice(0, 4) + '...' + st.wallet.slice(-4) : ''} conectada. Seus contatos só ficam visíveis para participantes desta operação com convite concluído.`),
        h('form', { onsubmit: (e) => { e.preventDefault(); signup({ fullName: f.fullName.value, email: f.email.value, phone: f.phone.value, country: f.country.value }); } },
          h('label', { class: 'field' }, h('span', {}, 'Nome completo'), f.fullName),
          h('label', { class: 'field' }, h('span', {}, 'E-mail'), f.email),
          h('label', { class: 'field' }, h('span', {}, 'Telefone / WhatsApp'), f.phone),
          h('label', { class: 'field' }, h('span', {}, 'País'), f.country), err,
          h('button', { class: 'btn btn-primary btn-block', disabled: st.busy }, 'CONTINUAR')));
    } else if (st.step === 'TERMS') {
      const cb = h('input', { type: 'checkbox', style: 'width:22px;min-height:22px;height:22px;margin:0' });
      add(wrap, progress(), h('h1', {}, 'Termos de participação'), summaryBox(),
        st.existing ? h('p', { class: 'notice notice-info', style: 'margin-bottom:12px' }, 'Carteira já cadastrada em outra mesa: o convite será vinculado ao seu cadastro existente.') : null,
        h('ul', { class: 'conditions', style: 'margin-bottom:16px' },
          h('li', {}, 'Ambiente privado, sem custódia: a Verum nunca guarda fundos, seed, chave privada ou senha.'),
          h('li', {}, 'Assinar a parceria é assinatura de mensagem. Autorizar liquidação é uma etapa separada, explicada antes.'),
          h('li', {}, 'Pernas fora da plataforma (espécie, fiat, ativo físico) não são verificadas nem garantidas por contrato.'),
          h('li', {}, 'Regras comerciais travadas só mudam por nova versão, com novos aceites de todos.'),
          h('li', {}, 'Seus dados seguem a LGPD: finalidade, minimização e exclusão, exceto registros de operações assinadas/auditadas.')),
        h('label', { style: 'display:flex;gap:12px;align-items:center;min-height:44px;margin-bottom:14px' }, cb, h('span', {}, 'Li e aceito os termos')), err,
        h('button', { class: 'btn btn-primary btn-block', disabled: st.busy, onclick: () => (cb.checked ? complete() : (st.error = 'Aceite os termos para entrar.', draw())) }, 'ACEITAR E ENTRAR NA DEAL ROOM'));
    }
    if (state.config?.demoMode) add(wrap, h('p', { class: 'small muted', style: 'margin-top:26px;text-align:center' }, 'DEMO / TESTNET — NO REAL FUNDS'));
    root.append(wrap);
  }

  const busy = async (fn) => { st.busy = true; draw(); try { await fn(); } catch (e) { fail(e); } finally { st.busy = false; if (st.step !== 'INVALID') draw(); } };

  const open = () => busy(async () => { await api('POST', '/invite/open', { token }); st.step = 'CHOICE'; });
  const verify = (code) => busy(async () => {
    try {
      const r = await api('POST', '/invite/verify-code', { token, code });
      st.summary = r.summary; st.step = 'WALLET';
    } catch (e) {
      if (e.code === 'CODE_INVALID') { st.error = e.message; return; }
      throw e;
    }
  });
  const connect = async () => {
    try {
      const acc = await walletPick({ title: 'Conectar Verum Wallet' });
      const ad = getAdapter();
      ad.provider.connect(acc.key);
      const ch = await api('POST', '/invite/wallet-challenge', { token, address: acc.address });
      const signature = await walletSign(ch.message, { title: 'Prova de posse da carteira', action: 'ASSINAR' });
      await busy(async () => {
        const r = await api('POST', '/invite/wallet-verify', { token, challengeId: ch.challengeId, nonce: ch.nonce, signature });
        st.wallet = r.walletAddress; st.existing = r.existingUser; st.step = r.step;
      });
    } catch (e) { if (e.code !== 'CANCELLED') fail(e); }
  };
  const signup = (data) => busy(async () => { await api('POST', '/invite/signup', { token, ...data }); st.step = 'TERMS'; });
  const complete = () => busy(async () => {
    const r = await api('POST', '/invite/complete', { token, acceptTerms: true });
    toast('Convite concluído. Bem-vindo à mesa.');
    location.hash = `#/deal/${r.dealId}`; location.reload();
  });

  // Mesmo navegador dentro da janela de retomada: continua de onde parou. Caso contrário, tela de entrada.
  (async () => {
    try {
      const r = await api('POST', '/invite/resume', { token });
      st.summary = r.summary; st.wallet = r.walletAddress;
      st.step = r.step === 'CHOICE' ? 'CHOICE' : r.step;
      st.existing = r.step === 'TERMS' && !!r.walletAddress;
    } catch { st.step = 'ENTRY'; }
    draw();
  })();
}

// Download da Verum Wallet. VERUM_WALLET_DOWNLOAD_URL (config) tem prioridade; este é o padrão.

  INTERMEDIACAO_COMPRA: 'Intermediação Compra', GRUPO_COMPRA: 'Grupo Compra', COMPRADOR: 'Comprador',
};

};
const INVITE_STATUS = { ATIVO: 'ATIVO', ABERTO: 'ABERTO', CONCLUIDO: 'CONCLUÍDO', EXPIRADO: 'EXPIRADO', REVOGADO: 'REVOGADO', BLOQUEADO: 'BLOQUEADO' };
const TABS = [['resumo', 'Resumo'], ['participantes', 'Participantes'], ['estrutura', 'Estrutura Comercial'], ['documentos', 'Documentos'], ['compliance', 'Compliance'], ['historico', 'Histórico'], ['settlement', 'Settlement']];

// ================================================================= boot
async function boot() {
  try {
    state.config = await api('GET', '/api/config');
    if (state.config.demoMode) state.personas = (await api('GET', '/api/demo/personas')).personas;
  } catch { state.config = { demoMode: false }; }
  const m = location.hash.match(/^#\/i\/([A-Za-z0-9_-]{43})/);
  if (m) window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/i/')) location.reload(); });
  if (m) { history.replaceState(null, '', location.pathname); startInvite(root, m[1]); return; }
  try { state.me = await api('GET', '/api/me'); } catch { state.me = null; }
  window.addEventListener('hashchange', () => { render(); });
  render();
}

function ribbon() {
  return h('div', { class: 'demo-ribbon' }, 'PRÉ-VISUALIZAÇÃO · DEMO / TESTNET — NO REAL FUNDS · ', h('button', { class: 'ribbon-reset', onclick: () => window.__votcPreviewReset() }, 'reiniciar demo'));
}

// ================================================================= roteamento
const lastScroll = {};
let currentRoute = null;
function parseRoute() {
  const p = (location.hash.replace(/^#/, '') || '/home').split('/').filter(Boolean);
  return { name: p[0] || 'home', id: p[1], sub: p[2], tab: p[3] };
}

async function render() {
  if (location.hash.startsWith('#/i/')) { location.reload(); return; }
  if (currentRoute) lastScroll[currentRoute] = window.scrollY;
  const route = parseRoute();
  const key = location.hash || '#/home';
  currentRoute = key;
  clear(root);
  add(root, ribbon());
  // Link de visualização: a entrada é pelo próprio link, não pelo login da mesa — quem recebeu o
  // link pode nem ter cadastro ainda. Sem este desvio, cairia no login e seria recusado.
  if (!state.me && route.name === 'm' && route.id) { root.append(await viewerLinkPage(route.id)); return; }
  if (!state.me) { root.append(loginPage()); return; }
  const main = h('main', { class: 'main', id: 'main' });
  root.append(h('div', { class: 'shell' }, sidebar(route), main), bottomNav(route));
  main.append(topbar());
  const body = h('div', {}, h('p', { class: 'muted' }, 'Carregando…'));
  main.append(body);
  try {
    const page = await pageFor(route);
    if (currentRoute !== key) return;
    clear(body); body.append(page);
    requestAnimationFrame(() => window.scrollTo(0, lastScroll[key] ?? 0));
  } catch (e) {
    if (e.status === 401) { state.me = null; render(); return; }
    clear(body);
    body.append(h('div', { class: 'empty-state' }, e.message || 'Não foi possível carregar.', h('div', { style: 'margin-top:12px' }, h('a', { class: 'btn btn-ghost btn-sm', href: '#/home' }, 'Voltar para a Home'))));
  }
}

function pageFor(r) {
  switch (r.name) {
    case 'home': return homePage();
    case 'dashboard': return dashboardPage();
    case 'deals': return listPage('UNICA');
    case 'parcerias': return listPage('PERMANENTE');
    case 'carteira': return walletPage();
    case 'perfil': return profilePage();
    case 'convites': return invitesPage();
    case 'participantes': return pickDealPage('participantes', 'Participantes', 'Quem ocupa cada função, o percentual travado de cada um e quem já assinou. Escolha a mesa.');
    case 'documentos': return pickDealPage('documentos', 'Documentos', 'Documentos ficam dentro de cada Deal Room, com versão, hash e aceites.');
    case 'compliance': return pickDealPage('compliance', 'Compliance', 'Status apenas informativos. A Verum NCNDA não emite aprovação regulatória nem garante legalidade de operações.');
    case 'settlement': return pickDealPage('settlement', 'Settlement', 'Distribuição exata por bps, com resíduo explícito. No DEMO, tudo é simulado.');
    case 'auditoria': return auditPage();
    case 'nova': return newOfferPage();
    case 'deal': return r.sub === 'room' ? dealRoomPage(r.id, r.tab || 'resumo') : partnersPage(r.id);
    case 'm': return sharedRoomPage(r.id, r.sub || 'resumo');
    default: return homePage();
  }
}

function navItems(desktop) {
  return desktop
    ? [['dashboard', 'Dashboard', 'home'], ['deals', 'Deals', 'deals'], ['parcerias', 'Parcerias', 'partner'], ['participantes', 'Participantes', 'people'], ['convites', 'Convites', 'invite'], ['documentos', 'Documentos', 'docs'], ['compliance', 'Compliance', 'shield'], ['settlement', 'Settlement', 'settle'], ['auditoria', 'Auditoria', 'audit'], ['perfil', 'Perfil', 'profile']]
    : [['home', 'Home', 'home'], ['deals', 'Deals', 'deals'], ['parcerias', 'Parcerias', 'partner'], ['carteira', 'Carteira', 'wallet'], ['perfil', 'Perfil', 'profile']];
}
function isCurrent(r, name) {
  if (r.name === name) return true;
  if (name === 'home' && (r.name === 'deal' || r.name === 'nova')) return true;
  if (name === 'dashboard' && (r.name === 'home' || r.name === 'deal' || r.name === 'nova')) return true;

}
function sidebar(r) {
  return h('nav', { class: 'sidebar', 'aria-label': 'Navegação principal' }, brand(),

}
function topbar() {

function back(href, label = 'Voltar') {

// ================================================================= login (sem senha)
function loginPage() {

  const enter = async () => {
    err.textContent = '';
    try { await walletLogin(); toast('Sessão iniciada.'); render(); }
    catch (e) {

      err.textContent = e.code === 'NO_WALLET' ? 'Verum Wallet não encontrada neste aparelho.' : e.message;
    }
  };
  // Quem chega por link de visualização precisa saber o que está abrindo antes de assinar.
  const shared = location.hash.startsWith('#/m/');
  return h('main', { class: 'gate' }, brand(),
    h('h1', {}, shared ? 'Visualizar operação' : 'Mesa OTC privada'),
    h('p', { class: 'lead' }, shared
      ? 'Você abriu um link de visualização de uma operação. Entre com a Verum Wallet para ver a mesa — é só leitura: você não assina nem altera nada.'
      : 'Acesso só por convite. Quem já concluiu o convite entra assinando com a Verum Wallet — sem senha.'),
    h('button', { class: 'btn btn-primary btn-block', onclick: enter }, 'ENTRAR COM A VERUM WALLET'),

/** Mesa aberta por link de visualização: mesmas abas, nenhuma ação. */
async function sharedRoomPage(token, tab) {
  let gate;
  // 401 aqui = sessão expirou no meio do caminho: volta para a entrada do link, não para o login
  // da mesa (quem abriu o link pode nem ter cadastro).
  try { gate = await api('GET', `/api/shared/${token}/gate`); }
  catch (e) { if (e.status === 401) return viewerConnectPage(token); throw e; }
  if (!gate.registered) return viewerSignupPage(token, gate);
  const d = await api('GET', `/api/shared/${token}`);
  return roomPage(d, tab, (k) => `#/m/${token}/${k}`,
    h('div', { class: 'notice notice-info', style: 'margin-bottom:14px' },
      'Visualização compartilhada — só leitura. Você vê a operação inteira, mas não pode assinar, convidar nem alterar nada.'));
}

/**
 * Link de visualização aberto por quem ainda não tem sessão — caso normal de carteira sem
 * cadastro. Decide entre conectar a carteira e se identificar olhando o portão: ele responde 401
 * enquanto não houver carteira provada, e passa a responder quando houver.
 *
 * Isto vive FORA do shell do app de propósito: o shell só desenha páginas quando há perfil
 * carregado, e aqui ainda não há — a conta só nasce no fim da identificação.
 */
async function viewerLinkPage(token) {
  let gate = null;
  try { gate = await api('GET', `/api/shared/${token}/gate`); }
  catch (e) {
    if (e.status === 401) return viewerConnectPage(token);                     // falta provar a carteira
    return h('main', { class: 'gate' }, brand('Link de visualização'),
      h('h1', {}, 'Link indisponível'), h('p', { class: 'lead' }, e.message || 'Este link de visualização não é mais válido.'));
  }
  return gate.registered ? viewerConnectPage(token) : viewerSignupPage(token, gate);
}

/**
 * Primeira tela do link: não mostra nada da operação. O cabeçalho da mesa só aparece depois da
 * carteira provada, e a operação só depois da identificação.
 */
function viewerConnectPage(token) {
  const err = h('p', { class: 'form-error', role: 'alert' });
  const btn = h('button', { class: 'btn btn-primary btn-block' }, 'CONECTAR VERUM WALLET');
  btn.onclick = async () => {
    err.textContent = ''; btn.disabled = true;
    try {
      const r = await walletViewLink(token);
      // Carteira com cadastro já entra na sessão; carteira nova segue sem sessão para a
      // identificação, e quem decide isso é o portão no próximo render.
      if (r.step === 'GATE') { try { state.me = await api('GET', '/api/me'); } catch { /* segue sem perfil */ } }
      render();
    } catch (e) {
      if (e.code !== 'CANCELLED') err.textContent = e.message;
      btn.disabled = false;
    }
  };
  return h('main', { class: 'gate' }, brand('Link de visualização'),
    h('h1', {}, 'Visualização de operação'),
    h('p', { class: 'lead' }, 'Você recebeu um link para ver uma operação em modo leitura. Conecte a Verum Wallet para continuar: você assina uma mensagem que prova que a carteira é sua. Não é transação e não movimenta fundos.'),
    btn, err,
    h('p', { class: 'small muted', style: 'margin-top:18px' }, 'Depois da carteira você se identifica, e só então a operação aparece. Visualizar não permite assinar, convidar nem alterar nada.'),
    state.config?.demoMode ? h('p', { class: 'small muted', style: 'margin-top:26px;text-align:center' }, 'DEMO / TESTNET — NO REAL FUNDS') : null);
}

          h('p', { class: 'notice notice-risk', style: 'margin-top:14px' }, 'Quem tem o link consegue repassá-lo. Se vazar, gere um novo: o anterior para de funcionar na hora.'),
          h('button', {

const reload = () => render();

function tabResumo(d) {
  const v = d.version;
  const actions = h('div', { class: 'btn-row', style: 'margin-top:14px' });
  const notes = [];
  if (v.status === 'PENDING_SIGNATURES' && d.me && !d.me.signed) {
    actions.append(h('button', {
      class: 'btn btn-primary', onclick: async () => {
        try {
          const r = await signFlow(`/api/deals/${d.id}/agreement/challenge`, `/api/deals/${d.id}/agreement/sign`, { title: 'ASSINAR PARCERIA', action: 'ASSINAR PARCERIA' });
          toast(r.locked ? 'Todos assinaram: PARTNERSHIP LOCKED.' : `Assinatura registrada (${r.k}/${r.n}).`); reload();
        } catch (e) { if (e.code !== 'CANCELLED') toast(e.message, 'err'); }
      },
    }, 'ASSINAR PARCERIA'));
    notes.push('Assinar a parceria é assinatura de mensagem com o hash dos termos: não movimenta fundos.');
  }
  if (d.isAdmin && v.status === 'DRAFT') {
    const empty = d.participants.filter((p) => !p.filled).length;
    const blocked = !d.linesValidation.ok || empty > 0;
    actions.append(h('button', {
      class: 'btn btn-blue', disabled: blocked, onclick: async () => {
        try { await api('POST', `/api/deals/${d.id}/submit`); toast('Enviada para assinatura. Termos travados por hash.'); reload(); } catch (e) { toast(e.message, 'err'); }
      },
    }, 'ENVIAR PARA ASSINATURA'));
    if (!d.linesValidation.ok) notes.push(`Bloqueado: ${d.linesValidation.errors.join(' ')}`);
    if (empty > 0) notes.push(`Bloqueado: ${empty} função(ões) sem parceiro. Gere o convite na aba Participantes.`);
  }
  if (d.isAdmin && v.status === 'PENDING_SIGNATURES') {
    actions.append(h('button', {
      class: 'btn btn-ghost', onclick: async () => {
        try { const r = await api('POST', `/api/deals/${d.id}/reopen`); toast(`Voltou para rascunho. ${r.invalidated} assinatura(s) invalidada(s).`); reload(); } catch (e) { toast(e.message, 'err'); }
      },
    }, 'VOLTAR PARA RASCUNHO'));
    if (state.config?.demoMode) {
      actions.append(h('button', { class: 'btn btn-ghost', onclick: () => demoCollect(d) }, 'DEMO: assinar como personas pendentes'));
    }
  }
  if (d.isAdmin && v.status === 'LOCKED') {
    actions.append(h('button', {
      class: 'btn btn-ghost', onclick: async () => {
        try { const r = await api('POST', `/api/deals/${d.id}/new-version`); toast(`Versão ${r.versionNo} criada em rascunho. Novos aceites serão exigidos.`); reload(); } catch (e) { toast(e.message, 'err'); }
      },
    }, 'CRIAR NOVA VERSÃO'));
  }
  // Link de visualização: só o admin da mesa (Pay Master 01) pode gerar e compartilhar.
  if (d.isAdmin) {
    actions.append(h('button', { class: 'btn btn-ghost', onclick: () => openShareSheet(d) }, 'LINK DE VISUALIZAÇÃO'));
  }
  return h('div', {},
    h('section', { class: 'panel' },
      h('div', { class: 'row' }, h('h2', {}, 'Parceria'), h('span', { class: 'kn' }, d.signatures.label)),
      h('dl', { class: 'kv' },
        h('dt', {}, 'Estado'), h('dd', {}, STATUS_PT[v.status]),
        h('dt', {}, 'Versão'), h('dd', { class: 'mono' }, `v${v.no} de ${v.versionsCount}`),
        h('dt', {}, 'Hash dos termos'), h('dd', { class: 'hash' }, v.termsHash ?? 'gerado ao enviar para assinatura'),
        h('dt', {}, 'Política de resíduo'), h('dd', {}, POLICY_LABEL[v.residualPolicy]),
        v.lockedAt ? [h('dt', {}, 'Travada em'), h('dd', {}, fmtDate(v.lockedAt))] : null,
        h('dt', {}, 'Sua função'), h('dd', {}, d.me ? `${d.me.role} · ${d.me.signed ? '✓ assinado' : '○ pendente'}` : (d.isAdmin ? 'Admin' : '—'))),
      ['LOCKED', 'FUNDED', 'EXECUTING', 'SETTLED'].includes(v.status)

/** DEMO: as personas pendentes assinam com as chaves DEMO deste aparelho; depois volta para a sessão original. */
async function demoCollect(d) {
  const ad = getAdapter();
  const accs = ad.provider.accounts();
  const pending = d.participants.filter((p) => p.filled && !p.signed && !p.isMe && accs.some((a) => a.address === p.wallet));
  if (!pending.length) { toast('Nenhuma persona DEMO pendente neste aparelho.', 'err'); return; }
  const original = state.me.wallet;
  const loginAs = async (addr) => {
    const acc = accs.find((a) => a.address === addr);
    ad.provider.connect(acc.key);
    const ch = await api('POST', '/auth/wallet-challenge', { address: addr });
    await api('POST', '/auth/wallet-verify', { challengeId: ch.challengeId, nonce: ch.nonce, signature: ad.provider.signMessage(ch.message) });
  };
  try {
    for (const p of pending) {
      await loginAs(p.wallet);
      const ch = await api('POST', `/api/deals/${d.id}/agreement/challenge`);
      await api('POST', `/api/deals/${d.id}/agreement/sign`, { challengeId: ch.challengeId, nonce: ch.nonce, signature: ad.provider.signMessage(ch.message) });
    }
    toast(`${pending.length} persona(s) assinaram (DEMO).`);
  } catch (e) { toast(e.message, 'err'); }
  finally {
    try { await loginAs(original); state.me = await api('GET', '/api/me'); } catch { state.me = null; }
    reload();
  }
}

function chainDiagram(d) {
  const order = ['VENDEDOR', 'GRUPO_VENDA', 'INTERMEDIACAO_VENDA', 'PAY_MASTER', 'INTERMEDIACAO_COMPRA', 'GRUPO_COMPRA', 'COMPRADOR'];

/** Editor de linhas (bps inteiros). Em DRAFT salva; fora de DRAFT o backend recusa e a tela mostra o bloqueio. */
function lineEditor(d) {
  const locked = d.version.status !== 'DRAFT';
  const slots = d.participants.map((p) => [`${p.roleKey}#${p.seq}`, p.role]);
  let lines = d.lines.map((l) => ({ ...l }));
  let policy = d.version.residualPolicy;
  const panel = h('section', { class: 'panel' });
  const draw = () => {
    clear(panel);
    const sum = lines.reduce((a, l) => a + (Number.isInteger(l.bps) ? l.bps : 0), 0);
    const ok = sum === d.version.gradeTotalBps && lines.every((l) => Number.isInteger(l.bps));
    add(panel,
      h('h2', {}, locked ? 'Alterar percentuais (parceria travada)' : 'Editar comissões (DRAFT)'),
      locked ? h('p', { class: 'notice notice-risk', style: 'margin-bottom:12px' }, 'Esta versão não está em DRAFT. Qualquer alteração será recusada pelo servidor e pelo banco — use CRIAR NOVA VERSÃO.') : null,
      lines.map((l, i) => h('div', { class: 'editor-line' },
        h('input', { value: l.label, 'aria-label': 'Rótulo da linha', maxlength: '60', oninput: (e) => { l.label = e.target.value; } }),
        h('input', {
          class: 'mono', value: bpsToPct(l.bps), inputmode: 'decimal', 'aria-label': 'Percentual (até 2 casas)',
          onchange: (e) => { const b = pctToBps(e.target.value); if (b === null) { toast('Percentual inválido (até 2 casas decimais).', 'err'); e.target.value = bpsToPct(l.bps); return; } l.bps = b; setTimeout(draw, 0); }, // redesenha depois do blur, sem engolir o clique seguinte
        }),
        h('div', { class: 'sub' },
          h('select', { 'aria-label': 'Beneficiário', onchange: (e) => { const [k, s] = e.target.value.split('#'); l.roleKey = k; l.roleSeq = Number(s); } },
            slots.map(([v, lab]) => h('option', { value: v, selected: v === `${l.roleKey}#${l.roleSeq}` }, lab))),
          h('select', { 'aria-label': 'Tipo', onchange: (e) => { l.kind = e.target.value; } }, Object.entries(KIND_LABEL).map(([k, lab]) => h('option', { value: k, selected: k === l.kind }, lab))),
          h('button', { class: 'icon-btn', 'aria-label': 'Remover linha', onclick: () => { lines.splice(i, 1); draw(); } }, '×')))),
      h('button', {
        class: 'btn btn-ghost btn-sm', style: 'margin-top:10px', onclick: () => {
          const first = d.participants[0];
          lines.push({ lineKey: `linha_${Date.now().toString(36)}`, label: 'Nova linha', roleKey: first.roleKey, roleSeq: first.seq, bps: 0, kind: 'COMISSAO' }); draw();
        },
      }, icon('plus'), 'Adicionar linha'),
      h('div', { class: `sumbar ${ok ? 'ok' : 'bad'}` }, h('span', {}, 'Soma das linhas'), h('span', {}, `${bpsToPct(sum)}% / ${bpsToPct(d.version.gradeTotalBps)}% ${ok ? '✓' : '✗ não fecha'}`)),
      h('label', { class: 'field' }, h('span', {}, 'Política de resíduo'),
        h('select', { onchange: (e) => { policy = e.target.value; } }, Object.entries(POLICY_LABEL).map(([k, lab]) => h('option', { value: k, selected: k === policy }, lab)))),
      h('button', {
        class: 'btn btn-blue btn-block', onclick: async () => {
          try {
            const payload = lines.map((l) => ({ lineKey: l.lineKey, label: l.label, roleKey: l.roleKey, roleSeq: l.roleSeq ?? 1, bps: l.bps, kind: l.kind }));
            const r = await api('PUT', `/api/deals/${d.id}/lines`, { lines: payload, residualPolicy: policy });
            toast(r.validation.ok ? 'Comissões salvas. Soma fecha com a grade.' : 'Salvo em rascunho, mas a soma ainda não fecha: não pode ir para assinatura.', r.validation.ok ? 'ok' : 'err');
            reload();
          } catch (e) { toast(e.message, 'err'); }
        },
      }, 'SALVAR COMISSÕES'));
  };
  draw();
  return panel;
}
