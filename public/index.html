  <link rel="stylesheet" href="/app.css">
  <script src="/vendor/nacl-fast.min.js" defer></script>
  <script src="/vendor/qrcode.js" defer></script>
  <!-- Verum Wallet: a carteira abre as plataformas parceiras DENTRO de um iframe dela, e quem cria
       window.verum é este conector (dela), conversando com a wallet-mãe por postMessage. A lista de
       origens vem do servidor (EMBED_ORIGINS) porque a CSP é script-src 'self' — sem script inline;
       sem ela o conector cairia no modo permissivo, mandando a mensagem a assinar para targetOrigin
       '*'. Fora do app da Verum nada disso acontece: init() devolve false e a mesa segue como antes.
       Ordem importa: origens, conector, app — defer e module preservam a ordem do documento. -->
  <script src="/verum-origins.js" defer></script>
  <script src="/vendor/verum-connector.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app"><noscript>Ative o JavaScript para usar a mesa privada.</noscript></div>
  <div id="overlay"></div>

</body>
